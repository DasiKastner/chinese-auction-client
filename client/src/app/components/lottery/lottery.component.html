<p-toolbar styleClass="p-mb-4">
    <div>{{num}}</div>
    <!-- זוכים -->
</p-toolbar>

<div class="lottery">
<div>
<p-dataView #dv [value]="gifts" [sortField]="sortField" [sortOrder]="sortOrder">
    <!-- <ng-template pTemplate="header">
        <div class="flex flex-column md:flex-row md:justify-content-between">
            <p-dropdown [options]="sortOptions" [(ngModel)]="sortKey" placeholder="Sort By Price" (onChange)="onSortChange($event)" styleClass="mb-2 md:mb-0" />
        </div>
    </ng-template> -->
        <ng-template pTemplate="list" let-gifts>
        <div class="grid grid-nogutter">
            <div class="col-12" *ngFor="let item of gifts; let first = first" class="col-12">
                <div class="flex flex-column sm:flex-row sm:align-items-center p-4 gap-3" [ngClass]="{ 'border-top-1 surface-border': !first }">
                    <div class="md:w-10rem relative">
                        <img class="block xl:block mx-auto border-round w-full" [src]="'images/' + item.image" [alt]="item.giftName" />
                        <!-- <p-tag [value]="item.inventoryStatus" [severity]="getSeverity(item)" class="absolute" [style.left.px]="4" [style.top.px]="4" /> -->
                    </div>
                    <div class="flex flex-column md:flex-row justify-content-between md:align-items-center flex-1 gap-4">
                        <div class="flex flex-row md:flex-column justify-content-between align-items-start gap-2">
                            <div>
                                <span class="font-medium text-secondary text-sm">{{ item.categoryName }}</span>
                                <div class="text-lg font-medium text-900 mt-2">{{ item.giftName }}</div>
                            </div>
                            <!-- <div class="surface-100 p-1" style="border-radius: 30px">
                                <div class="surface-0 flex align-items-center gap-2 justify-content-center py-1 px-2" style="border-radius: 30px; box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.04), 0px 1px 2px 0px rgba(0, 0, 0, 0.06)">
                                    <span class="text-900 font-medium text-sm">{{ item.rating }}</span>
                                    <i class="pi pi-star-fill text-yellow-500"></i>
                                </div>
                            </div> -->
                        </div>
                        <div class="flex flex-column md:align-items-end gap-5">
                            <span class="text-xl font-semibold text-900">{{ item.price | currency: 'ILS'}}</span>
                            @if(item.winnerName == ''){
                                <div class="flex flex-row-reverse md:flex-row gap-2">
                                    <p-button icon="pi pi-sparkles" class="flex-auto md:flex-initial white-space-nowrap" label="הגרלה" (click)="raffle(item.id)" [disabled]="false" />
                                </div> 
                            }
                            @else{
                                <div class="flex flex-row-reverse md:flex-row gap-2">
                                    <p-button icon="pi pi-sparkles" class="flex-auto md:flex-initial white-space-nowrap" label="הגרלה" (click)="raffle(item.id)" [disabled]="true" />
                                </div> 
                            }
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
</p-dataView>
</div>
<div class="pas"></div>
<div>
    <p-table 
    [value]="winners" 
    styleClass="p-datatable-striped" 
    [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="header">
            <tr>
                <th>שם מתנה</th>
                <th>שם זוכה</th>
                <th>מייל</th>
                <th>טלפון</th>
                <th>כתובת</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-winner>
            <tr>
                <td>{{winner.giftname}}</td>
                <td>{{winner.winnerName}}</td>
                <td>{{winner.email}}</td>
                <td>{{winner.phone}}</td>
                <td>{{winner.address}}</td>
            </tr>
        </ng-template>
</p-table>

</div>
</div>
