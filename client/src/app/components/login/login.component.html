<p-toast></p-toast>
<p-toolbar styleClass="p-mb-4">

</p-toolbar>
<div class="template">
<div class="flex flex-column md:flex-row">
    
    <div class="w-full md:w-5 flex align-items-center justify-content-center py-5">
        <p-button label="משתמש חדש" icon="pi pi-user-plus" styleClass="p-button-success w-10rem"  (click)="newUser()"/>
    </div>
    <div class="w-full md:w-2">
        <p-divider layout="vertical" styleClass="hidden md:flex">
            <b>או</b>
        </p-divider>
        <p-divider layout="horizontal" styleClass="flex md:hidden" [align]="'center'">
            <b>או</b>
        </p-divider>
    </div>
    <div class="w-full md:w-5 flex flex-column align-items-center justify-content-center gap-3 py-5">
        <div class="flex flex-wrap justify-content-center align-items-center gap-2">            
            <input pInputText id="username" type="text" class="w-12rem" [(ngModel)]="user.userName"/>
            <label class="w-6rem"> מספר זהות </label>
        </div>
        <div class="flex flex-wrap justify-content-center align-items-center gap-2">           
            <input pInputText id="password" type="password" class="w-12rem" [(ngModel)]="user.password"/>
            <label class="w-6rem"> סיסמא </label>
        </div>
        <p-button label="כניסה" icon="pi pi-user" styleClass="w-10rem mx-auto" (click)="login()" severity="contrast"/>
    </div> 
</div>
</div>
